<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>تغيير كلمة المرور</title>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&family=Amiri:wght@400;700&display=swap" rel="stylesheet">
  <style>
    body {
      margin: 0;
      font-family: "Cairo", Arial, sans-serif;
      background: #f4f7fb;
      direction: rtl;
    }
    .box {
      max-width: 520px;
      margin: 80px auto;
      background: #fff;
      padding: 30px;
      border-radius: 18px;
      box-shadow: 0 12px 30px rgba(0,0,0,.08);
    }
    h1 {
      font-family: "Amiri", serif;
      text-align: center;
      margin-top: 0;
      color: #486281;
    }
    .field {
      margin-bottom: 16px;
    }
    label {
      display: block;
      margin-bottom: 8px;
      font-weight: 700;
    }
    input {
      width: 100%;
      padding: 12px 14px;
      border: 1px solid #dce5ee;
      border-radius: 12px;
      font-size: 15px;
    }
    .btn {
      width: 100%;
      border: none;
      padding: 12px;
      border-radius: 12px;
      background: #5f7ea8;
      color: #fff;
      font-weight: 700;
      cursor: pointer;
    }
    .back {
      display: block;
      text-align: center;
      margin-top: 15px;
      text-decoration: none;
      color: #486281;
      font-weight: 700;
    }
  </style>
</head>
<body>
  <div class="box">
    <h1>تغيير كلمة المرور</h1>
    <p>العضو: {{ member['full_name'] }}</p>

    <form method="post">
      <div class="field">
        <label>اسم المستخدم</label>
        <input type="text" value="{{ member['username'] }}" readonly>
      </div>

      <div class="field">
        <label>كلمة المرور الجديدة</label>
        <input type="password" name="new_password" required>
      </div>

      <button type="submit" class="btn">حفظ</button>
    </form>

    <a class="back" href="{{ url_for('admin_committee_members') }}">رجوع</a>
  </div>
</body>
</html>
