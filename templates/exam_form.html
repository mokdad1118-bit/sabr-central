{% extends "base.html" %}
{% block title %}إضافة اختبار سبر{% endblock %}{% block content %}
<div class="container">
    <h1>إضافة اختبار سبر</h1>

    <div class="student-box">
      <strong>الطالب:</strong> {{ student['full_name'] }}
    </div>

    {% if error %}
      <div class="error-box">{{ error }}</div>
    {% endif %}

    <form method="post" enctype="multipart/form-data">
      <label>نوع السبر</label>
      <select name="exam_type" id="exam_type" required onchange="updateLevels()">
        <option value="">اختر</option>
        <option value="نظراً">نظراً</option>
        <option value="غيباً">غيباً</option>
      </select>

      <label>الفرع</label>
      <select name="level" id="level" required>
        <option value="">اختر نوع السبر أولاً</option>
      </select>

      <label>العلامة</label>
      <input type="number" name="mark" min="0" max="100" required>

      <label>صورة نتيجة الاختبار</label>
      <input type="file" name="result_image" accept="image/*" required>

      <button type="submit">حفظ الاختبار</button>
    </form>

    <div class="back-link">
      <a href="{{ url_for('member_student_detail', student_id=student['id']) }}">رجوع</a>
    </div>
  </div>
{% endblock %}
{% block scripts %}
<script>
  function updateLevels() {
    const examType = document.getElementById("exam_type").value;
    const levelSelect = document.getElementById("level");
    levelSelect.innerHTML = "";

    let levels = [];

    if (examType === "نظراً") {
      levels = ["1-10", "1-20", "1-30"];
    } else if (examType === "غيباً") {
      levels = ["1-5", "1-10", "1-15", "1-20", "1-25", "26-30", "1-30"];
    } else {
      const opt = document.createElement("option");
      opt.value = "";
      opt.textContent = "اختر نوع السبر أولاً";
      levelSelect.appendChild(opt);
      return;
    }

    const defaultOption = document.createElement("option");
    defaultOption.value = "";
    defaultOption.textContent = "اختر";
    levelSelect.appendChild(defaultOption);

    levels.forEach(function(level) {
      const opt = document.createElement("option");
      opt.value = level;
      opt.textContent = level;
      levelSelect.appendChild(opt);
    });
  }
</script>
{% endblock %}
