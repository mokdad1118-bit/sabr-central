<!DOCTYPE html>
<html lang="ar">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>إضافة اختبار سبر</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #f4f7fb;
      --surface: rgba(255, 255, 255, 0.86);
      --surface-strong: #ffffff;
      --primary: #5f7ea8;
      --primary-dark: #486281;
      --accent: #8aa6c1;
      --text: #1f2d3d;
      --muted: #6b7b8c;
      --border: #dce5ee;
      --shadow: 0 12px 30px rgba(57, 82, 110, 0.10);
      --shadow-hover: 0 18px 36px rgba(57, 82, 110, 0.16);
      --radius: 20px;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      direction: rtl;
      font-family: "Cairo", "Amiri", "Arial", sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at top right, rgba(138, 166, 193, 0.16), transparent 28%),
        radial-gradient(circle at bottom left, rgba(95, 126, 168, 0.12), transparent 26%),
        linear-gradient(180deg, #f7f9fc 0%, #eef3f8 100%);
    }

    .container {
      max-width: 920px;
      margin: 0 auto;
      padding: 36px 18px 40px;
    }

    h1 {
      margin: 0 0 12px;
      font-family: "Amiri", "Cairo", serif;
      font-size: 38px;
      font-weight: 700;
      color: var(--primary-dark);
      text-align: center;
    }

    p {
      color: var(--muted);
      line-height: 1.8;
      margin: 0 0 16px;
      font-size: 16px;
    }

    .msg {
      padding: 14px 16px;
      border-radius: 14px;
      margin: 0 0 16px;
      border: 1px solid transparent;
      background: var(--surface-strong);
      box-shadow: var(--shadow);
      text-align: right;
    }

    form {
      background: var(--surface);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(220, 229, 238, 0.9);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 26px 24px;
      margin-top: 22px;
    }

    label {
      display: block;
      margin: 14px 0 8px;
      color: var(--primary-dark);
      font-weight: 700;
      font-size: 15px;
    }

    input[type="text"],
    input[type="number"],
    select,
    input[type="file"] {
      width: 100%;
      border: 1px solid var(--border);
      background: #fbfdff;
      border-radius: 14px;
      padding: 14px 16px;
      font-size: 16px;
      color: var(--text);
      outline: none;
      transition: border-color 0.2s ease, box-shadow 0.2s ease, transform 0.2s ease;
      font-family: "Cairo", "Amiri", sans-serif;
    }

    input[type="text"]:focus,
    input[type="number"]:focus,
    select:focus {
      border-color: rgba(95, 126, 168, 0.55);
      box-shadow: 0 0 0 4px rgba(95, 126, 168, 0.12);
      background: #fff;
    }

    input[type="file"] {
      padding: 10px 12px;
    }

    input[type="file"]::file-selector-button {
      border: none;
      background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
      color: #fff;
      padding: 10px 14px;
      border-radius: 10px;
      margin-left: 14px;
      cursor: pointer;
      font-family: "Cairo", "Amiri", sans-serif;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    input[type="file"]::file-selector-button:hover {
      transform: translateY(-1px);
    }

    button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      margin-top: 20px;
      border: none;
      cursor: pointer;
      padding: 12px 18px;
      border-radius: 12px;
      font-weight: 700;
      font-size: 15px;
      color: #fff;
      background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
      box-shadow: 0 10px 22px rgba(95, 126, 168, 0.22);
      transition: transform 0.2s ease, box-shadow 0.2s ease;
      font-family: "Cairo", "Amiri", sans-serif;
    }

    button:hover {
      transform: translateY(-2px);
      box-shadow: 0 14px 28px rgba(95, 126, 168, 0.28);
    }

    a {
      color: var(--primary-dark);
      text-decoration: none;
      font-weight: 700;
    }

    a:hover {
      text-decoration: underline;
    }

    .back-link {
      margin-top: 20px;
      text-align: center;
    }

    .student-box {
      background: #f8fbff;
      border: 1px solid #e3ecf7;
      border-radius: 14px;
      padding: 12px 14px;
      margin-bottom: 18px;
      color: var(--text);
      font-size: 16px;
    }

    .student-box strong {
      color: var(--primary-dark);
    }

    .error-box {
      color: #8a2f2f;
      background: #ffe8e8;
      border: 1px solid #e3b7b7;
      border-radius: 14px;
      padding: 14px 16px;
      margin-bottom: 16px;
    }

    @media (max-width: 640px) {
      .container {
        padding: 24px 14px 30px;
      }

      h1 {
        font-size: 30px;
      }

      form {
        padding: 20px 16px;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>إضافة اختبار سبر</h1>

    <div class="student-box">
      <strong>الطالب:</strong> {{ student['full_name'] }}
    </div>

    {% if error %}
      <div class="error-box">{{ error }}</div>
    {% endif %}

    <form method="post" enctype="multipart/form-data">
      <label>نوع السبر</label>
      <select name="exam_type" id="exam_type" required onchange="updateLevels()">
        <option value="">اختر</option>
        <option value="نظراً">نظراً</option>
        <option value="غيباً">غيباً</option>
      </select>

      <label>الفرع</label>
      <select name="level" id="level" required>
        <option value="">اختر نوع السبر أولاً</option>
      </select>

      <label>العلامة</label>
      <input type="number" name="mark" min="0" max="100" required>

      <label>صورة نتيجة الاختبار</label>
      <input type="file" name="result_image" accept="image/*" required>

      <button type="submit">حفظ الاختبار</button>
    </form>

    <div class="back-link">
      <a href="{{ url_for('member_student_detail', student_id=student['id']) }}">رجوع</a>
    </div>
  </div>

  <script>
  function updateLevels() {
    const examType = document.getElementById("exam_type").value;
    const levelSelect = document.getElementById("level");
    levelSelect.innerHTML = "";

    let levels = [];

    if (examType === "نظراً") {
      levels = ["1-10", "1-20", "1-30"];
    } else if (examType === "غيباً") {
      levels = ["1-5", "1-10", "1-15", "1-20", "1-25", "26-30", "1-30"];
    } else {
      const opt = document.createElement("option");
      opt.value = "";
      opt.textContent = "اختر نوع السبر أولاً";
      levelSelect.appendChild(opt);
      return;
    }

    const defaultOption = document.createElement("option");
    defaultOption.value = "";
    defaultOption.textContent = "اختر";
    levelSelect.appendChild(defaultOption);

    levels.forEach(function(level) {
      const opt = document.createElement("option");
      opt.value = level;
      opt.textContent = level;
      levelSelect.appendChild(opt);
    });
  }
</script>

</body>
</html>
