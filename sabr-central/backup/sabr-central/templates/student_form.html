<!DOCTYPE html>
<html lang="ar">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>إدخال طالب</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #f4f7fb;
      --surface: rgba(255, 255, 255, 0.86);
      --surface-strong: #ffffff;
      --primary: #5f7ea8;
      --primary-dark: #486281;
      --accent: #8aa6c1;
      --text: #1f2d3d;
      --muted: #6b7b8c;
      --border: #dce5ee;
      --shadow: 0 12px 30px rgba(57, 82, 110, 0.10);
      --shadow-hover: 0 18px 36px rgba(57, 82, 110, 0.16);
      --radius: 20px;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      direction: rtl;
      font-family: "Cairo", "Amiri", "Arial", sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at top right, rgba(138, 166, 193, 0.16), transparent 28%),
        radial-gradient(circle at bottom left, rgba(95, 126, 168, 0.12), transparent 26%),
        linear-gradient(180deg, #f7f9fc 0%, #eef3f8 100%);
    }

    .container {
      max-width: 920px;
      margin: 0 auto;
      padding: 36px 18px 40px;
    }

    h1 {
      margin: 0 0 12px;
      font-family: "Amiri", "Cairo", serif;
      font-size: 38px;
      font-weight: 700;
      color: var(--primary-dark);
      text-align: center;
    }

    .panel {
      background: var(--surface);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(220, 229, 238, 0.9);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 26px 24px;
      margin-top: 22px;
    }

    form {
      display: block;
    }

    label {
      display: block;
      margin: 14px 0 8px;
      color: var(--primary-dark);
      font-weight: 700;
      font-size: 15px;
    }

    input[type="text"],
    input[type="date"] {
      width: 100%;
      border: 1px solid var(--border);
      background: #fbfdff;
      border-radius: 14px;
      padding: 14px 16px;
      font-size: 16px;
      color: var(--text);
      outline: none;
      transition: border-color 0.2s ease, box-shadow 0.2s ease, transform 0.2s ease;
      font-family: "Cairo", "Amiri", sans-serif;
    }

    input[type="text"]:focus,
    input[type="date"]:focus {
      border-color: rgba(95, 126, 168, 0.55);
      box-shadow: 0 0 0 4px rgba(95, 126, 168, 0.12);
      background: #fff;
    }

    button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      margin-top: 20px;
      border: none;
      cursor: pointer;
      padding: 12px 18px;
      border-radius: 12px;
      font-weight: 700;
      font-size: 15px;
      color: #fff;
      background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
      box-shadow: 0 10px 22px rgba(95, 126, 168, 0.22);
      transition: transform 0.2s ease, box-shadow 0.2s ease;
      font-family: "Cairo", "Amiri", sans-serif;
    }

    button:hover {
      transform: translateY(-2px);
      box-shadow: 0 14px 28px rgba(95, 126, 168, 0.28);
    }

    a {
      color: var(--primary-dark);
      text-decoration: none;
      font-weight: 700;
    }
    .select-year {
  width: 100%;
  padding: 12px 16px;
  border: 1px solid #dce5ee;
  border-radius: 14px;
  background: #fbfdff;
  color: #1f2d3d;
  font-size: 16px;
  font-family: "Cairo", "Amiri", sans-serif;
  outline: none;
  cursor: pointer;
  transition: border-color 0.2s ease, box-shadow 0.2s ease, background 0.2s ease;
  appearance: none;
  -webkit-appearance: none;
  -moz-appearance: none;
}

.select-year:focus {
  border-color: rgba(95, 126, 168, 0.55);
  box-shadow: 0 0 0 4px rgba(95, 126, 168, 0.12);
  background: #fff;
}

.select-year option {
  color: #1f2d3d;
  background: #fff;
}

    a:hover {
      text-decoration: underline;
    }

    .back-link {
      margin-top: 20px;
      text-align: center;
    }

    @media (max-width: 640px) {
      .container {
        padding: 24px 14px 30px;
      }

      h1 {
        font-size: 30px;
      }

      .panel {
        padding: 20px 16px;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>إدخال طالب جديد</h1>

    <div class="panel">
      <form method="post">
        <label>الاسم الثلاثي</label>
        <input type="text" name="full_name" id="full_name" required>

        <label>اسم الأب</label>
        <input type="text" name="father_name" id="father_name">

        <label>اسم الأم</label>
        <input type="text" name="mother_name" id="mother_name">

        <label>كنية الأم</label>
        <input type="text" name="mother_kunya" id="mother_kunya">

        <label for="birth_date">سنة الميلاد</label>
<select id="birth_date" name="birth_date" class="select-year">
  <option value="">اختر السنة</option>
  {% for year in range(1950, 2027) %}
    <option value="{{ year }}">{{ year }}</option>
  {% endfor %}
</select>
        <label>الرقم الوطني</label>
        <input type="text" name="national_id" id="national_id">

        <label>القيد</label>
        <input type="text" name="family_book" id="family_book">

        <label>البلدة</label>
        <input type="text" name="town" id="town">

        <label>الجامع الذي يحفظ به القرآن</label>
        <input type="text" name="mosque_name" id="mosque_name">

        <label>رقم التواصل</label>
        <input type="text" name="phone_number" id="phone_number">

        <button type="submit">حفظ الطالب</button>
      </form>
    </div>

    <div class="back-link">
      <a href="{{ url_for('member_dashboard') }}">رجوع</a>
    </div>
  </div>
</body>
</html>
