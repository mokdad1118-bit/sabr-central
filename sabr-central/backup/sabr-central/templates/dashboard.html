<!DOCTYPE html>
<html lang="ar">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>لوحة التحكم</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #f4f7fb;
      --surface: rgba(255, 255, 255, 0.86);
      --surface-strong: #ffffff;
      --primary: #5f7ea8;
      --primary-dark: #486281;
      --accent: #8aa6c1;
      --text: #1f2d3d;
      --muted: #6b7b8c;
      --border: #dce5ee;
      --shadow: 0 12px 30px rgba(57, 82, 110, 0.10);
      --shadow-hover: 0 18px 36px rgba(57, 82, 110, 0.16);
      --radius: 20px;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      direction: rtl;
      font-family: "Cairo", "Amiri", "Arial", sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at top right, rgba(138, 166, 193, 0.16), transparent 28%),
        radial-gradient(circle at bottom left, rgba(95, 126, 168, 0.12), transparent 26%),
        linear-gradient(180deg, #f7f9fc 0%, #eef3f8 100%);
    }

    .container {
      max-width: 920px;
      margin: 0 auto;
      padding: 36px 18px 40px;
      text-align: center;
    }

    h1 {
      margin: 0 0 10px;
      font-family: "Amiri", "Cairo", serif;
      font-size: 40px;
      font-weight: 700;
      color: var(--primary-dark);
    }

    p {
      color: var(--muted);
      line-height: 1.8;
      margin: 0 0 18px;
      font-size: 16px;
    }

    .panel {
      background: var(--surface);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(220, 229, 238, 0.9);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 26px 24px;
      margin-top: 22px;
      text-align: center;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 220px;
      text-decoration: none;
      border: none;
      cursor: pointer;
      padding: 12px 18px;
      border-radius: 12px;
      font-weight: 700;
      font-size: 15px;
      color: #fff;
      background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
      box-shadow: 0 10px 22px rgba(95, 126, 168, 0.22);
      transition: transform 0.2s ease, box-shadow 0.2s ease, filter 0.2s ease;
      font-family: "Cairo", "Amiri", sans-serif;
      margin: 8px 6px;
    }

    .btn:hover {
      transform: translateY(-2px);
      filter: brightness(1.03);
      box-shadow: 0 14px 28px rgba(95, 126, 168, 0.28);
    }

    .logout {
      display: inline-block;
      margin-top: 22px;
      color: var(--primary-dark);
      text-decoration: none;
      font-weight: 700;
      padding: 10px 16px;
      border-radius: 999px;
      background: rgba(95, 126, 168, 0.10);
      border: 1px solid rgba(95, 126, 168, 0.18);
      transition: background 0.2s ease, transform 0.2s ease;
    }

    .logout:hover {
      background: rgba(95, 126, 168, 0.16);
      transform: translateY(-1px);
    }

    @media (max-width: 640px) {
      .container {
        padding: 24px 14px 30px;
      }

      h1 {
        font-size: 30px;
      }

      .btn {
        width: 100%;
        min-width: unset;
        margin: 8px 0;
      }

      .panel {
        padding: 20px 16px;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>لوحة التحكم</h1>
    <p>مرحبًا {{ username }}</p>

    <div class="panel">
      {% if session.get('role') == 'admin' %}
        <p><a class="btn" href="{{ url_for('admin_dashboard') }}">الدخول إلى لوحة الأدمن</a></p>
        <p><a class="btn" href="{{ url_for('students') }}">عرض جميع الطلاب</a></p>
      {% elif session.get('role') == 'committee_member' %}
        <p><a class="btn" href="{{ url_for('member_dashboard') }}">الدخول إلى لوحة عضو اللجنة</a></p>
        <p><a class="btn" href="{{ url_for('member_dashboard') }}">عرض الطلاب الخاصين بي</a></p>
      {% endif %}
    </div>

    <a class="logout" href="{{ url_for('logout') }}">تسجيل الخروج</a>
  </div>
</body>
</html>
